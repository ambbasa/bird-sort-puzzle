<!doctype html><html lang="ko" translate="no"><head><meta charset="utf-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>버드 소트 퍼즐</title>
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="icons-icon.svg?v=b544461f"><link rel="apple-touch-icon" href="icons-icon-180.png?v=6fe7bd6a"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2F8BE6">
<link rel="stylesheet" href="assets-theme.css?v=366ff1f2"><link rel="stylesheet" href="css-style.css?v=fe2a685a"><link rel="stylesheet" href="assets-v5ui-v5-launch.css?v=6bcd55d8"><link rel="stylesheet" href="assets-v5ui-v5-rec.css?v=206d6336"><link rel="stylesheet" href="assets-v7ui-v7.css?v=186d920c"><link rel="stylesheet" href="assets-v7ui-v7b-perch-wood.css?v=77e1f249"><link rel="stylesheet" href="assets-v8-v8.css?v=f0011a44"><link rel="stylesheet" href="assets-birds-badge-lg-overlay.css?v=9e65a671"></head><body>
<!-- L6: instant first paint (inline, no assets) until the game boots; no login/consent sheet on entry -->
<div id="splash" class="v5"><img class="splash-logo" src="assets-v5ui-logo-emblem.svg?v=39bf6aa7" alt=""><div class="splash-title">버드 소트 퍼즐</div><div class="splash-sub">BIRD SORT</div><div class="splash-birds" aria-hidden="true"><span class="perch"></span><i></i><i></i><i></i></div><div class="splash-load">불러오는 중…</div></div>
<div id="rotate">세로 화면으로 돌려 주세요</div>
<!-- icons inlined from assets-icons-*.svg so they inherit currentColor and work over file:// -->
<div id="app">
<header class="hud">
  <div class="hud-left"><button class="btn" id="settings" aria-label="설정 열기"><i class="v5h v5h-settings" aria-hidden="true"></i></button>
  <button class="btn stagesbtn" id="stagesBtn" aria-label="스테이지 열기"><i class="v5h v5h-map" aria-hidden="true"></i>스테이지</button></div>
  <div class="hud-mid"><div class="lvl" id="stage"></div><div class="stars" id="hudstars"></div><div class="sub" id="moves"></div></div>
  <button class="btn" id="hint" aria-label="힌트"><i class="v5h v5h-hint" aria-hidden="true"></i></button>
</header>
<div id="board"></div>
<div id="combo"></div>
<div id="tutor" class="tutor" hidden><div class="v7-bubble tutor-text" role="status"></div></div><img id="tutfinger" class="v7-tut-finger" src="assets-v7ui-tut-finger.svg?v=efae3a0d" alt="" hidden style="position:fixed"><i id="tutring" class="v7-tut-ring" hidden style="position:fixed"></i>
<footer class="bottom">
  <button class="btn" id="undo"><i class="v5h v5h-undo" aria-hidden="true"></i><span>되돌리기</span><span class="cnt" id="undocnt"></span></button>
  <button class="btn" id="restart"><i class="v5h v5h-restart" aria-hidden="true"></i><span>재시작</span></button>
  <button class="btn primary" id="add"><span class="v5-ico-add-perch" aria-hidden="true"></span><span>횃대 추가</span><span class="cnt adtag-cnt">▶광고</span></button>
</footer>
<div id="banner" class="banner"></div>
</div>
<div id="overlay" class="ov v5"><div class="card">
  <div class="clear-art" aria-hidden="true"></div>
  <div class="title" id="cleartitle">클리어!</div><div class="bigstars" id="bigstars"></div>
  <div id="result" class="sub"></div><div id="startip" class="sub startip"></div><div id="coinsGot" class="sub"></div>
  <button class="btn primary wide" id="next">다음</button><button class="btn wide" id="again">재시작</button>
</div></div>
<div id="menu" class="ov"><div class="card">
  <div class="title">스테이지</div><div id="coins" class="sub"></div>
  <div id="dailycard"></div>
  <div id="mapwrap"><div class="saga-map" id="sagamap" role="list" aria-label="스테이지"><div id="sagasize"><div class="saga-track" id="sagatrack"></div></div></div><div id="maptheme" class="maptheme"></div></div>
  <button class="btn wide" id="closeMenu">닫기</button></div></div>
<div id="setov" class="ov"><div class="card" role="dialog" aria-label="설정"><div class="title">설정</div><div id="setsect"><div class="sect">접근성</div><label class="toggle"><span>심볼 크게</span><input type="checkbox" id="bigsym"></label><label class="toggle"><span>움직임 줄이기<small id="rmnote" class="note" hidden> 기기 설정으로 켜짐</small></span><input type="checkbox" id="rmotion"></label><label class="toggle" id="v8chipsRow"><span>남은 새 수 보기</span><input type="checkbox" id="v8chipsOpt" checked></label><div class="sect">사운드</div><label class="toggle"><span>효과음</span><input type="checkbox" id="sound" checked></label><label class="toggle"><span>진동</span><input type="checkbox" id="haptics" checked></label><div class="sect">비행</div><label class="toggle"><span>빠른 비행</span><input type="checkbox" id="fastfly"></label><div class="sect">화면</div><button class="btn wide" id="theme">라이트/다크 전환</button></div><button class="btn wide" id="closeSet">닫기</button><button class="btn wide" id="exitBtn">게임 종료</button>
</div></div>
<div id="endov" class="ov v5"><div class="card endcard" role="dialog" aria-label="모든 스테이지 클리어">
  <div class="endart" aria-hidden="true"><span>🐦</span><span>🎉</span><span>🐤</span></div>
  <div class="title">200 스테이지 모두 클리어!</div><div class="sub">정말 대단해요! 새 스테이지가 곧 추가될 예정이에요.<br>그동안 매일 바뀌는 오늘의 도전에 참여해 보세요.</div>
  <button class="btn primary wide" id="endDaily">오늘의 도전</button><button class="btn wide" id="endMap">스테이지</button>
</div></div>
<div id="themeov" class="ov"><div class="card" role="dialog" aria-label="새 테마 해금"><div class="tcard" data-theme="forest" aria-hidden="true"></div><div class="title">새 테마 해금!</div><div class="sub" id="themesub"></div><button class="btn primary wide" id="themeOk">계속하기</button></div></div>
<div id="restartov" class="ov"><div class="card" role="dialog" aria-label="다시하기 확인">
  <div class="title">처음부터 다시 할까요?</div><div class="sub" id="restartMsg">지금까지의 이동이 사라져요.</div>
  <button class="btn primary wide" id="restartYes">다시하기</button><button class="btn wide" id="restartNo">취소</button></div></div>
<div id="exitov" class="ov"><div class="card">
  <div class="title">게임을 종료할까요?</div><div class="sub">진행 상황은 저장돼요.</div>
  <button class="btn primary wide" id="exitNo">계속하기</button><button class="btn wide" id="exitYes">종료하기</button>
</div></div>
<template id="staricon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3" fill="currentColor"/></svg></template>

</body></html>
